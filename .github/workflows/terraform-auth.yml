name: AWS-Autorisierung prüfen

on:
  push:
    branches:
      - main
  workflow_dispatch:

# NEU: Erlaubt dem Workflow, sich bei GitHub einen "Ausweis" (OIDC-Token) zu holen
permissions:
  id-token: write
  contents: read

# GEÄNDERT: Die zwei Secrets sind raus, nur die Region bleibt
env:
  AWS_REGION: us-east-1

jobs:
  auth:
    name: Wer bin ich in AWS?
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v5

      # NEU: Holt mit dem Ausweis kurzlebige Zugangsdaten für die Rolle
      - name: Bei AWS anmelden (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: AWS CLI – wer bin ich?
        run: aws sts get-caller-identity

      - name: Terraform installieren
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform – wer bin ich?
        working-directory: auth-check
        run: |
          terraform init -input=false
          terraform plan -input=false
